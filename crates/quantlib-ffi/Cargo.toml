[package]
name = "quantlib-ffi"
version = "0.0.0"
description = "Minimal FFI to QuantLib's day counters, used as the reference implementation in finance-tools' tests."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
cc = "1"

# Not `workspace = true`: this crate is the one place that needs `unsafe`.
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
