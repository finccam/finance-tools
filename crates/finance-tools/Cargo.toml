[package]
name = "finance-tools"
version = "0.1.0"
description = "QuantLib's day counters (Actual/360, Actual/Actual, 30/360, ...) in pure Rust on jiff dates, tested against QuantLib."
readme = "README.md"
keywords = ["finance", "day-count", "quantlib", "year-fraction", "fixed-income"]
categories = ["finance", "date-and-time"]
include = ["/src", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
jiff.workspace = true

[lints]
workspace = true

[dev-dependencies]
# QuantLib, the reference implementation for `tests/quantlib.rs`.
quantlib-ffi.workspace = true
proptest = "1.11.0"
