[package]
name = "finance-tools-wasm"
version = "0.1.0"
description = "wasm-bindgen bindings for finance-tools, consumed by the finance-tools npm package."
# A build input of `packages/finance-tools`, never published on its own.
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
finance-tools.workspace = true
# Pinned exactly: must match the `wasm-bindgen-cli` version used in `flake.nix`.
# Safe here because this crate is never a dependency of anything else.
wasm-bindgen = "=0.2.130"

[lints]
workspace = true
